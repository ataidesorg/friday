version: 2

project_name: ink

builds:
  - id: ink
    main: ./cmd/ink
    binary: ink
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X github.com/ataidesorg/ink/internal/buildinfo.Version={{ .Tag }}
      - -X github.com/ataidesorg/ink/internal/buildinfo.Commit={{ printf "%.12s" .FullCommit }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  # Versioned archive: ink_v0.1.0_linux_amd64.tar.gz
  - id: versioned
    ids: [ink]
    formats: [tar.gz]
    name_template: "ink_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: "ink_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE, NOTICE]

  # Stable alias for install.sh without INK_VERSION, which resolves
  # /releases/latest/download/ink_<os>_<arch>.tar.gz.
  - id: latest-alias
    ids: [ink]
    formats: [tar.gz]
    name_template: "ink_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: "ink_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE, NOTICE]

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-snapshot"

changelog:
  use: github-native

release:
  github:
    owner: ataidesorg
    name: ink
  draft: false
  prerelease: auto
