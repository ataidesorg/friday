# Friday provider registry.
#
# Compiled into the binary. This list is short on purpose: an entry earns its
# place by being reachable, or by being the only thing that exercises an
# implemented wire or auth path. Every other vendor is reachable through
# `openrouter`, or by pointing `openai` at a custom base_url — Friday does not
# need a row per vendor to talk to one.
#
# An empty base_url means Friday has not confirmed an endpoint: the entry is
# unusable until the user sets providers.<id>.base_url. status is "unverified"
# until a Friday test completes a real call (never claim more), then
# "verified"; an entry that stops working degrades to "broken".

[[provider]]
id = "actual"
aliases = ["actual-computer", "actualcomputer", "aci"]
wire = "chat_completions"
base_url = "https://api.actual.inc/v1"
base_url_env = "ACTUAL_BASE_URL"
privacy = "public_cloud"
status = "unverified"
auth = { kind = "key", env = ["ACTUAL_API_KEY"], optional = true }
notes = "the one optional-key cloud row: proves Friday skips a cloud probe with no key rather than treating it as keyless local; loopback deployment (http://127.0.0.1:8080) runs keyless, set privacy local in config for it"

[[provider]]
id = "anthropic"
wire = "anthropic_messages"
base_url = "https://api.anthropic.com"
base_url_env = "ANTHROPIC_BASE_URL"
privacy = "public_cloud"
status = "unverified"
auth = { kind = "key", env = ["ANTHROPIC_API_KEY"] }
key_url = "https://console.anthropic.com/settings/keys"

[[provider]]
id = "anthropic-oauth"
wire = "anthropic_messages"
base_url = "https://api.anthropic.com"
privacy = "public_cloud"
status = "unverified"
auth = { kind = "external_cli", env = ["ANTHROPIC_TOKEN", "CLAUDE_CODE_OAUTH_TOKEN"], opt_in_risk = true }
oauth = { auth_url = "https://claude.ai/oauth/authorize", token_url = "https://console.anthropic.com/v1/oauth/token", client_id = "9d1c250a-e61b-44d9-88ed-5944d1962f5e", scopes = ["org:create_api_key", "user:profile", "user:inference"], redirect_uri = "https://console.anthropic.com/oauth/code/callback" }
notes = "Claude Code credential reuse; Anthropic's terms explicitly prohibit subscription OAuth tokens in third-party tools (2026-02-20 update); endpoints recorded from public third-party sources, unverified by Friday"

