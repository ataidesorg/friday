# Friday compiled defaults. This file is the complete configuration
# reference: every schema key lives here. User, profile, and project files
# override these; FRIDAY__ env vars and CLI --set come last.
#
#   friday config show      effective merged config
#   friday config explain K  one key and which layer set it
#
# Secrets never belong in any of these files. Providers reference
# credentials through an auth table:
#
#   [providers.example.auth]
#   source = "env"                 # env | keyring | secret_store | command
#   name   = "EXAMPLE_API_KEY"     # env var (source = "env")
#   # service = "friday"  account = "example"   (source = "keyring")
#   # id = "..."                                 (source = "secret_store")
#   # command = ["op", "read", "..."]            (source = "command"; user layer only)

# Bumped on incompatible schema changes; loaders reject other versions.
schema_version = 1

[profile]
# Which [profiles.<name>] is active unless --profile NAME overrides it.
active = "default"

[profiles.default]
# Free-text label shown by `friday config show`.
description = "Strict, concise default profile"
# How verbose the agent should be. Stored on the profile; not yet injected
# into the system prompt.
#   concise  |  detailed
style = "concise"
# How conservative policy is when a tool would otherwise be allowed.
#   strict    = ask the human before any non-read-only tool, even one listed
#               in tools.allow. This is the shipped default.
#   standard  = trust tools.allow; only tools.require_approval prompts.
# "Strict" does not mean auto-approve. It means more prompts, not fewer.
posture = "strict"
# Product this profile is for. Not a TUI mode (those are code / plan / ask,
# cycled with Shift+Tab).
#   code       = coding agent (this default)
#   assistant  = the [profiles.assistant] product; switch with --profile assistant
harness = "code"
# Namespace Learned: lines are tagged with. There is no durable memory store
# yet: candidates are extracted in-run and then discarded.
#   global  |  project  |  personal
memory_namespace = "project"
# Highest sensitivity a Learned: candidate may have. Ranked
# public < internal < personal. "secret" is never storable.
# A candidate above this cap is dropped. Only applies to that extraction.
#   public  |  internal  |  personal
sensitivity_cap = "internal"

[profiles.assistant]
# Second built-in profile (`friday --profile assistant`). Same coding tools;
# only the memory tags differ. Not a TUI "assistant mode".
description = "Personal assistant: personal memory, sensitivity cap personal"
style = "concise"
posture = "strict"
harness = "assistant"
memory_namespace = "personal"
sensitivity_cap = "personal"

# No providers are configured by default; the harness reports "unavailable"
# until you add one (`/connect` or a [providers.NAME] table).
[providers]

[models]
# Named routes: [models.routes.<name>]
#   provider        = id of a [providers.*] table
#   model           = model id on that provider
#   fallbacks       = other route names to try
#   max_cost_usd    = refuse the call if estimated cost exceeds this
#   max_latency_ms  = prefer a faster fallback
#   privacy         = local | private_cloud | public_cloud
#   allow_fallback  = true | false
[models.routes]

# Model prices in USD per million tokens: [models.pricing."<model>"]
#   input_usd_per_mtok
#   output_usd_per_mtok
#   cached_usd_per_mtok
# A model missing here has unknown cost; session/task/day caps then cannot
# be enforced (see /advisories).
[models.pricing]

[models.routing]
# Route used when a task does not name one. Must exist in models.routes.
# Empty = no default route (you pick one at launch or with /model).
default = ""

[budgets]
# Hard USD ceilings. A run stops with budget_exceeded when any is hit, but
# only if the model is in [models.pricing]. Unpriced models warn instead.
per_task_usd = 2.0
per_session_usd = 10.0
per_day_usd = 25.0

[sandbox]
# Where tool commands run.
#   process     = private HOME/TMPDIR, fixed PATH, timeouts; the host network
#                 is still reachable (see docs/architecture/sandbox-and-policy.md)
#   container   = Docker/Podman, --network none, cgroup limits
#   unavailable = refuse to run (safe default for a locked-down install)
provider = "process"

[sandbox.limits]
cpu_cores = 1
memory_mb = 2048
disk_mb = 1024
max_processes = 64
# Wall-clock ceiling per sandbox command, in seconds.
wall_clock_secs = 600

[tools]
# Fate of a tool that is in none of allow / require_approval / deny.
#   deny              = refuse it (fail closed; this default)
#   require_approval  = prompt the human
#   allow             = run it with no prompt
# This is not the default for write_file or run_command — those are listed
# under require_approval below. Unlisted and unknown tools stay denied.
default_effect = "deny"
# Tools that run with no prompt. Keep this to read-only work.
allow = ["read_file", "list_dir", "search", "ask_user_question", "todo_write", "goal_complete", "goal_blocked", "goal_wait"]
# Tools that always need a human yes (or `friday run --yes` / /always-approve).
# run_command also needs an argv prefix from tools.commands.allowed or
# project.commands.
require_approval = ["write_file", "apply_patch", "run_command"]
# Experimental per-resource rules ([[tools.rules]] with tool + path glob or
# argv prefix + effect) apply only when this flag is on.
experimental_rules = false
rules = []
# Tools that are never available, even with --yes.
deny = []

[tools.commands]
# Argv prefixes run_command may run once approved.
# Empty = no prefixes; only named project.commands.* (test, etc.) run, and
# only as the validation command, not as free tool calls.
# Example: allowed = ["git", "go test", "go vet"]
allowed = []

[memory]
# Namespaces a future durable memory store may write to. Not used yet:
# Learned: lines become in-run candidates and are not persisted.
namespaces = ["global", "project", "personal"]

[memory.retention]
# Reserved. Episodic memories would expire after this many days.
episodic_days = 30
# Reserved. Working memory lifetime: session | task.
working = "session"

[telemetry]
# Local JSONL event trail under the project (replay with `friday trace`).
# Nothing is ever sent off the machine. This is not product analytics.
#   off    = accepted; the CLI currently still writes the trail
#   local  = write the trail (this default)
mode = "local"
# How much free text the trail keeps after secret redaction.
#   standard  = secrets scrubbed, prose kept
#   minimal   = secrets scrubbed and free text blanked
privacy = "standard"
# Reserved. Intended local trail retention in days; not yet enforced.
retention_days = 30

[evals]
# What `friday eval` does with a failing scenario.
#   required  = the eval run fails (this default)
#   advisory  = report the failure, do not fail the process
gate = "required"
# Minimum scenario pass rate (percent) when gate = required.
min_pass_rate = 100

[project]
# Project display name; usually set in .friday/config.toml.
name = ""
# Instruction files read into the project context layer, in order.
# Example: instructions = ["AGENTS.md", ".friday/instructions.md"]
instructions = []

[project.commands]
# Named deterministic commands the harness may run as validation, e.g.
#   test = "go test ./..."
# Values here are also allowed argv prefixes for run_command once approved.

[tui]
# Launch theme. Built-ins: friday, dark, light, ansi.
# Empty = the built-in default. A live /theme pick saved in the Friday home
# wins over this.
theme = ""
# Hide warnings about guardrails that could not be enforced: an unpriced
# model (budgets unenforceable) and a missing validation command (result
# unverified). Real failures always show. Toggle in chat with /advisories.
#   true  |  false
hide_advisories = false

[tui.keys]
# Rebind chat shortcuts, e.g. palette = "ctrl+o".
# Actions: palette, scroll_up, scroll_down.
# ctrl+c, enter, and esc are fixed.

[agents]
# Named agent profiles: [agents.NAME]
#   description  = shown by /agent
#   prompt       = extra system instructions
#   route        = optional models.routes name
#   tools        = allowlist; empty = the session's full set
# /agent NAME activates one. Policy still gates every tool it may hold.

[tools.permissions]
# Per-tool override of the coarse lists: tool = "allow" | "ask" | "deny".
# Example: write_file = "ask"
# A tool may not appear in both a list (allow / require_approval / deny)
# and this table.

[tools.custom]
# Config-declared argv tools: [tools.custom.NAME]
#   argv         = program and arguments (required)
#   description  = shown to the model
#   risk         = a risk class, default execute_local
#   schema       = JSON Schema for the arguments; the model's arguments JSON
#                  is piped to stdin
# User layer only; each custom tool defaults to require_approval.

[format]
# Post-write formatters. Off by default; failures warn and never block.
# User layer only.
#   true  |  false
enabled = false

[format.languages]
# Per-language formatters, e.g.
# [format.languages.go]
# command = ["gofmt", "-w"]
# extensions = [".go"]

# [[tools.rules]] are experimental per-resource rules (first match wins):
#   tool     = tool name
#   path     = optional glob ("docs/**")
#   argv     = optional argv prefix
#   effect   = allow | require_approval | deny
# They apply only when tools.experimental_rules = true.

[mcp]
# MCP servers over stdio: [mcp.NAME]
#   command  = argv
#   enabled  = true | false (default false)
# Tools appear as mcp_NAME_TOOL and default to require_approval.
# User layer only; no network transports.

[lsp]
# Language servers over stdio: [lsp.NAME]
#   command     = argv
#   extensions  = [".go"]
#   enabled     = true | false (default false)
# Diagnostics for edited files are appended to write_file/apply_patch output.
# User layer only; off by default.
